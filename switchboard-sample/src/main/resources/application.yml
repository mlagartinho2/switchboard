spring:
  application:
    name: switchboard-sample

# Every Switchboard control is configuration-only and read once at startup (contracts/configuration.md).
# Case keys MUST be bracketed ("[EXPEDITED]") so they keep their case and underscores.
switchboard:
  groups:
    refunds:
      # Optional. When absent, every refunds resolver is consulted in @Order bean order.
      # resolution-order: [refund-type-header, refund-amount]
      cases:
        "[STANDARD]":
          owner: payments-team
          version: "1.0"
          description: Standard refund flow
        "[EXPEDITED]":
          enabled: true                    # kill switch: set to false to answer 404 for this case
          owner: payments-team
          version: "1.0"
          description: Expedited refund for large amounts, settles within 4 hours
    payments:
      cases:
        "[CARD]":
          owner: payments-team
          version: "1.0"
          description: Card payment capture

# GET /actuator/switchboard: the read-only routing report (contracts/actuator-endpoint.md).
# Like /actuator/env, restrict it to operators in a real deployment.
management:
  endpoints:
    web:
      exposure:
        include: health,switchboard
